<!DOCTYPE html>
<html lang="en">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <title>Padaria Bom Pão</title>
</head>
<body>
    <!-- Container com Header inicial incluindo nav e logo da empresa -->
    <div class="containerNav">
        <header>
            <img src="/Assets/logo_bom_pao.webp" alt="logo_bom_pao" width="200px">
            <nav>
                <ul>
                    <li>home</li>
                    <li>Quem somos</li>
                    <li>Contato</li>
                </ul>
            </nav>            
        </header>
    </div>

    <!--Container com seção hero(apresentação da empresa)-->
    <div class="containerHero">
        <main>
            <h1>PADARIA BOM PÃO</h1>
            <p>Produtos de qualidade!</p>
        </main>
    </div>

    <!--Container com seção de apresentação das informações dos produtos-->
    <section class="sectionProdutos">
        <!--Cada div é um container de um card do produto-->
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </section>


    <!--Container com avaliações de clientes-->
    <div class="containerAvaliacao">
        <section>

        </section>
    </div>

    <!--Container com seção de contato-->
    <div class="containerContato">
        <h3>Entre em contato conosco!</h3>
        <form action="">
            <label for="inputNome">Nome</label><br>
            <input id="inputNome" type="text" placeholder="Digite seu nome completo"><br>
            <label for="inputAssunto">Assunto</label><br>
            <input id="inputAssunto" type="text" placeholder="Qual o motivo do seu contato?"><br><br>
            <textarea name="" id="textarea" rows="10" cols="25" placeholder="Escreva sua mensagem"></textarea>
        </form>
    </div>

    <!--container com informações de rede e endereços-->
    <div class="containerEndereco">
        <footer>

        </footer>
    </div>
</body>
